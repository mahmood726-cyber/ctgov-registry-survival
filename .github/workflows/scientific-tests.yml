name: Registry survival scientific checks
on:
  push:
  pull_request:
jobs:
  scientific-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q rse
      - run: python -m pytest tests -q
